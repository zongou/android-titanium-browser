name: Test

on:
  # push:
  #   paths: .github/workflows/test.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # - name: Install herdr
      #   run: curl -fsSL https://herdr.dev/install.sh | sh

      - name: Install fresh
        run: curl -fsSL https://raw.githubusercontent.com/sinelaw/fresh/refs/heads/master/scripts/install.sh | sh

      - uses: zongou/run-ttyd-server@main
        name: Run ttyd server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref }}
        with:
          credential: ${{ secrets.TTYD_CREDENTIAL }}
          command: fresh

      # - uses: zongou/run-vscode-server@main
      #   name: Run vscode server
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     GH_REPO: ${{ github.repository }}
      #     BRANCH: ${{ github.ref }}
      #   with:
      #     token: ${{ secrets.VSCODE_SERVER_TOKEN }}

      # - name: Print envs
      #   run: |
      #     echo "inputs: ${{ toJson(inputs) }}"
      #     echo "github: ${{ toJson(github) }}"

      - name: Print workspace
        run: |
          echo "workspace: ${{ github.workspace }}"

      - name: Restore data
        id: restore-data
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: |
            ~/.cache/ccache
          key: ccache-chromium-
          restore-keys: |
            cccache-chromium-
            ccache-

      - name: Print cache hit
        run: |
          echo "cache-primary-key=${{ steps.restore-data.outputs.cache-primary-key }}"
          echo "cache-hit=${{ steps.restore-data.outputs.cache-hit }}"
          echo "cache-matched-key=${{ steps.restore-data.outputs.cache-matched-key }}"

      # - name: Keep alive
      #   run: sleep 6h
