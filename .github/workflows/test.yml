name: Test

on:
  push:
    paths: .github/workflows/test.yml
  workflow_dispatch:
    inputs:
      vscode-server-token:
        description: "vscode server token"
        required: false
      ttyd-credential:
        description: "ttyd credential"
        required: false
      restore-data:
        description: "restore data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: zongou/run-ttyd-server@main
        name: Run ttyd server
        with:
          credential: ${{ inputs.ttyd-credential || secrets.TTYD_CREDENTIAL }}

      - uses: zongou/run-vscode-server@main
        name: Run vscode server
        with:
          token: ${{ inputs.vscode-server-token || secrets.VSCODE_SERVER_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Restore data
        id: restore-data
        if: inputs.restore-data == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            vanadium
            depot_tools
            chromium
          key: data-
          restore-keys: |
            data-

      - name: Print chache hit status
        if: inputs.restore-data == 'true'
        run: |
          echo "Cache hit: ${{ steps.restore-data.outputs.cache-matched-key }}"
          if ${{ steps.restore-data.outputs.cache-hit }}
          then
            echo "Cache hit"
          else
            echo "Cache not hit"
          fi

      - name: Keep alive
        run: sleep 6h
