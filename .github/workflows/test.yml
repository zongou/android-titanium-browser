name: Test

on:
  push:
    paths: .github/workflows/test.yml
  workflow_dispatch:
    inputs:
      vscode-server-token:
        description: "vscode server token"
        required: false
      ttyd-credential:
        description: "ttyd user:pass"
        required: false
      restore-data:
        description: "restore data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install herdr
        run: curl -fsSL https://herdr.dev/install.sh | sh

      - uses: zongou/run-ttyd-server@main
        name: Run ttyd server
        with:
          credential: ${{ inputs.ttyd-credential || secrets.TTYD_CREDENTIAL }}
          command: herdr

      - uses: zongou/run-vscode-server@main
        name: Run vscode server
        with:
          token: ${{ inputs.vscode-server-token || secrets.VSCODE_SERVER_TOKEN }}

      - name: Keep alive
        run: sleep 6h